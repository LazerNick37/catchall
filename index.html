<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Whoops</title>
<style>
  body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    background: #111;
    color: #eee;
    font-family: system-ui, -apple-system, sans-serif;
    text-align: center;
    padding: 20px;
  }
  h1 {
    font-size: clamp(2rem, 8vw, 4.5rem);
    margin: 0;
    line-height: 1.1;
  }
  .sub {
    font-size: 1.1rem;
    color: #999;
    margin-top: 10px;
  }
  .sub-first {
    margin-top: 30px;
  }
  .links {
    margin-top: 6px;
    display: flex;
    flex-direction: column;
    gap: 12px;
  }
  .countdown {
    font-size: 1.3rem;
    color: #999;
    margin-bottom: 20px;
  }
  .links a {
    color: #eee;
    text-decoration: none;
    font-size: 1.1rem;
  }
</style>
</head>
<body>

  <div class="countdown">Redirecting in <span id="count">10</span>...</div>
  <h1>whoops, you done messed up</h1>
  <div class="sub sub-first">(or I messed up)</div>
  <div class="sub">If you were not automatically redirected to the site</div>

  <div class="links">
    <a href="https://lazernick37.win">click here</a>
  </div>

  <script>
    let seconds = 10;
    const countEl = document.getElementById("count");
    const timer = setInterval(() => {
      seconds--;
      countEl.textContent = seconds;
      if (seconds <= 0) {
        clearInterval(timer);
        window.location.href = "https://lazernick37.win";
      }
    }, 1000);
  </script>

</body>
</html>
